<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin — House of Joba</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="admin.css">
</head>
<body>

<!-- Icon sprite: referenced as <svg><use href="#i-name"></use></svg> -->
<svg style="display:none" aria-hidden="true">
  <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></symbol>
  <symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 3.2-5.5 6.5-5.5s6.5 1.9 6.5 5.5"/><path d="M17 8.5a3 3 0 0 0 0-5M18.5 19.5c0-2.4-1-4-2.5-5"/></symbol>
  <symbol id="i-flow" viewBox="0 0 24 24"><rect x="3" y="4" width="5" height="16" rx="1.5"/><rect x="10" y="4" width="5" height="11" rx="1.5"/><rect x="17" y="4" width="4" height="7" rx="1.5"/></symbol>
  <symbol id="i-bag" viewBox="0 0 24 24"><path d="M5 7h14l-1 13H6L5 7z"/><path d="M9 7a3 3 0 0 1 6 0"/></symbol>
  <symbol id="i-box" viewBox="0 0 24 24"><path d="M4 7l8-4 8 4v10l-8 4-8-4z"/><path d="M4 7l8 4 8-4M12 11v10"/></symbol>
  <symbol id="i-chart" viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></symbol>
  <symbol id="i-wallet" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M16 14.5h2"/></symbol>
  <symbol id="i-cog" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1l2-1.6-2-3.4-2.4 1a7 7 0 0 0-1.7-1l-.4-2.6h-4l-.4 2.6a7 7 0 0 0-1.7 1l-2.4-1-2 3.4 2 1.6a7 7 0 0 0 0 2l-2 1.6 2 3.4 2.4-1a7 7 0 0 0 1.7 1l.4 2.6h4l.4-2.6a7 7 0 0 0 1.7-1l2.4 1 2-3.4-2-1.6a7 7 0 0 0 .1-1z"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></symbol>
  <symbol id="i-bell" viewBox="0 0 24 24"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 8 3 8H3s3-1 3-8"/><path d="M10 21h4"/></symbol>
  <symbol id="i-menu" viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-edit" viewBox="0 0 24 24"><path d="M4 20h4L18 10l-4-4L4 16z"/><path d="M13 5l4 4"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M5 7h14M9 7V5h6v2M6 7l1 13h10l1-13"/></symbol>
  <symbol id="i-mail" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></symbol>
  <symbol id="i-phone" viewBox="0 0 24 24"><path d="M5 4h4l2 5-2.5 1.5a12 12 0 0 0 5 5L15 13l5 2v4a1.5 1.5 0 0 1-1.7 1.5A16.5 16.5 0 0 1 3.5 5.7 1.5 1.5 0 0 1 5 4z"/></symbol>
  <symbol id="i-note" viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></symbol>
  <symbol id="i-up" viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></symbol>
  <symbol id="i-down" viewBox="0 0 24 24"><path d="M12 5v14M6 13l6 6 6-6"/></symbol>
  <symbol id="i-ext" viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9"/><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></symbol>
  <symbol id="i-filter" viewBox="0 0 24 24"><path d="M3 5h18l-7 8v6l-4-2v-4z"/></symbol>
  <symbol id="i-inbox" viewBox="0 0 24 24"><path d="M3 13h5l1.5 3h5L16 13h5"/><path d="M4.5 6h15l1.5 7v5a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1v-5z"/></symbol>
</svg>

<div class="admin">

  <!-- ── Sidebar ──────────────────────────────────────── -->
  <aside class="sidebar" id="sidebar">
    <a class="side-brand" href="index.html">
      <img src="images/jobalogo.png" alt="House of Joba">
    </a>

    <nav class="side-scroll" id="sideNav"><!-- injected by admin.js --></nav>

    <div class="side-user">
      <div class="side-avatar">AA</div>
      <div class="side-user-info">
        <strong>Azmayeen A.</strong>
        <span>Store owner</span>
      </div>
    </div>
  </aside>

  <!-- ── Main ─────────────────────────────────────────── -->
  <div class="main">
    <header class="topbar">
      <button class="mobile-menu icon-btn" id="mobileMenu" aria-label="Menu">
        <svg><use href="#i-menu"></use></svg>
      </button>
      <h1 id="viewTitle">Dashboard</h1>
      <span class="topbar-sub" id="viewSub"></span>

      <div class="topbar-actions">
        <div class="search">
          <svg><use href="#i-search"></use></svg>
          <input type="search" id="globalSearch" placeholder="Search contacts, orders…"
                 aria-label="Search" autocomplete="off">
          <kbd>/</kbd>
        </div>
        <button class="icon-btn" aria-label="Notifications">
          <svg><use href="#i-bell"></use></svg>
          <span class="dot"></span>
        </button>
        <a class="btn btn-ghost" href="index.html" target="_blank">
          View store <svg><use href="#i-ext"></use></svg>
        </a>
      </div>
    </header>

    <main class="content" id="content"><!-- views injected by admin.js --></main>
  </div>
</div>

<!-- ── Contact / deal detail drawer ───────────────────── -->
<div class="drawer-scrim" id="drawerScrim" hidden></div>
<aside class="drawer" id="drawer" role="dialog" aria-label="Record detail" hidden>
  <div class="drawer-top">
    <span class="muted" id="drawerKind">Contact</span>
    <button class="icon-btn" id="drawerClose" aria-label="Close">
      <svg><use href="#i-x"></use></svg>
    </button>
  </div>
  <div class="drawer-body" id="drawerBody"><!-- injected by admin.js --></div>
</aside>

<!-- ── Record modal (add / edit) ──────────────────────── -->
<div class="modal-scrim" id="modal" hidden>
  <div class="modal" role="dialog" aria-label="Record">
    <div class="modal-head">
      <h3 id="modalTitle">Add record</h3>
      <button class="icon-btn" id="modalClose" aria-label="Close">
        <svg><use href="#i-x"></use></svg>
      </button>
    </div>
    <form class="modal-form" id="modalForm"><!-- injected by admin.js --></form>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script src="products.js"></script>
<script src="crm-data.js"></script>
<script src="admin.js"></script>
</body>
</html>
